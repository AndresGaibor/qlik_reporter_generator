name: CI
on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run verify
      - run: docker compose config
      - run: docker build --target api .
      - run: docker build --target web .
