# Nginx configuration for Qlik Automate Creator
# Puerto interno del API (conecta desde el container nginx → container api)

server {
    listen 80;
    server_name ${SERVER_NAME:-_};

    # Frontend estático (build de Vite)
    root /usr/share/nginx/html;
    index index.html;

    # Cache assets con hash (build de Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API al backend (puerto interno del container api)
    location /api/ {
        proxy_pass http://api:4523;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para operaciones largas (ejecuciones de automatizaciones)
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /api/salud {
        proxy_pass http://api:4523;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
